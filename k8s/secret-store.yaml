# =============================================================================
# ClusterSecretStore for GCP Secret Manager
# =============================================================================
# External Secrets Operator가 GCP Secret Manager에 접근하기 위한 설정
# Workload Identity를 사용하여 인증
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: app
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: asia-northeast3-a
          clusterName: telecom-app-cluster
          serviceAccountRef:
            name: app
            namespace: app
