apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-core
  namespace: app
  labels:
    app: api-core
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-core
  template:
    metadata:
      labels:
        app: api-core
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: app
      containers:
        - name: api-core
          image: asia-northeast3-docker.pkg.dev/PROJECT_ID/telecom-app-repo/api-core:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            # CloudSQL Proxy 사용
            - name: POSTGRES_HOST
              value: "127.0.0.1"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "app_db"
            # OpenTelemetry (optional)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.monitoring:4318/v1/traces"
            - name: OTEL_SAMPLING_PROBABILITY
              value: "0.1"
          envFrom:
            - secretRef:
                name: api-core-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp

        # Cloud SQL Auth Proxy sidecar
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
          args:
            - "--structured-logs"
            - "--auto-iam-authn"
            - "$(DB_CONNECTION_NAME)"
          env:
            - name: DB_CONNECTION_NAME
              valueFrom:
                secretKeyRef:
                  name: api-core-secrets
                  key: DB_CONNECTION_NAME
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false

      volumes:
        - name: tmp
          emptyDir: {}
