# =============================================================================
# SecretProviderClass for GCP Secret Manager
# =============================================================================
# CSI Driver가 Secret Manager 시크릿을 Pod에 파일로 마운트하도록 정의
# PROJECT_ID는 CI/CD에서 sed로 치환됨
# =============================================================================

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-core-secrets
  namespace: app
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/telecom-app-db-user/versions/latest"
        path: "db-username"
      - resourceName: "projects/PROJECT_ID/secrets/telecom-app-db-password/versions/latest"
        path: "db-password"
      - resourceName: "projects/PROJECT_ID/secrets/telecom-app-db-connection-name/versions/latest"
        path: "db-connection-name"
