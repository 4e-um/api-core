# =============================================================================
# ExternalSecret for api-core
# =============================================================================
# GCP Secret Manager에서 Kubernetes Secret으로 동기화
# PROJECT_ID는 CI/CD에서 sed로 치환됨
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-core-secrets
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: api-core-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: telecom-app-db-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: telecom-app-db-password
    - secretKey: DB_CONNECTION_NAME
      remoteRef:
        key: telecom-app-db-connection-name
