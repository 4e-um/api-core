# ============================================================================
# Backend Deploy Workflow (GCP/GKE)
# ============================================================================
# 역할:
#   - Integrate workflow 성공 후 자동 실행
#   - integrate에서 생성된 JAR artifact 사용 (빌드 재수행 없음)
#   - Docker 이미지 빌드 및 Artifact Registry 푸시
#   - GKE 클러스터에 배포
#
# Job 구조:
#   prepare ──> build-image ──> deploy
#
# 트리거:
#   - Integrate Backend workflow가 main 브랜치에서 성공적으로 완료된 후
#   - 수동 실행 (workflow_dispatch) - 최근 성공한 integrate run의 artifact 사용
#
# GitHub Secrets (Settings > Secrets and variables > Actions > Secrets):
#   - GCP_WORKLOAD_IDENTITY_PROVIDER: Workload Identity Provider (projects/.../providers/...)
#   - GCP_SERVICE_ACCOUNT: GCP Service Account 이메일
#
# GitHub Variables (Settings > Secrets and variables > Actions > Variables):
#   - GCP_PROJECT_ID: GCP 프로젝트 ID
#   - GCP_REGION: GCP 리전 (예: asia-northeast3)
#   - GKE_CLUSTER: GKE 클러스터 이름
#   - K8S_NAMESPACE: Kubernetes 네임스페이스 (예: app)
# ============================================================================

name: Deploy Backend to GKE

permissions:
  contents: read
  actions: read
  id-token: write

on:
  workflow_run:
    workflows: ["Integrate Backend"]
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

env:
  SERVICE_NAME: api-core

jobs:
  # ==========================================================================
  # Prepare Job - Artifact 준비
  # ==========================================================================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    outputs:
      run_id: ${{ steps.get-run-info.outputs.run_id }}
      head_sha: ${{ steps.get-run-info.outputs.head_sha }}
      short_sha: ${{ steps.get-run-info.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get workflow run info
        id: get-run-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected. Finding latest successful integrate run..."

            RUN_INFO=$(gh run list \
              --workflow "Integrate Backend" \
              --branch main \
              --status success \
              --event push \
              --limit 1 \
              --json databaseId,headSha)

            RUN_ID=$(echo "$RUN_INFO" | jq -r '.[0].databaseId')
            HEAD_SHA=$(echo "$RUN_INFO" | jq -r '.[0].headSha')

            if [ "$RUN_ID" == "null" ] || [ -z "$RUN_ID" ]; then
              echo "::error::No successful integrate workflow run found"
              exit 1
            fi

            echo "Found run ID: $RUN_ID, commit: $HEAD_SHA"
          else
            echo "workflow_run trigger detected"
            RUN_ID="${{ github.event.workflow_run.id }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          SHORT_SHA=${HEAD_SHA:0:7}

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Download artifact from Integrate workflow
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-app
          path: build/libs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.get-run-info.outputs.run_id }}

      - name: Verify and upload artifact
        run: |
          echo "Downloaded artifacts:"
          ls -la build/libs/
          JAR_FILE=$(ls build/libs/*.jar | head -1)
          echo "JAR file: $JAR_FILE"

      - name: Upload artifact for next jobs
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: build/libs/*.jar
          retention-days: 1

  # ==========================================================================
  # Build Image Job - Docker 빌드 및 Artifact Registry 푸시
  # ==========================================================================
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [prepare]

    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ needs.prepare.outputs.head_sha }}
      image_url: ${{ steps.build.outputs.image_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifact
          path: build/libs

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        env:
          IMAGE_URL: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/telecom-app-repo/${{ env.SERVICE_NAME }}
        run: |
          docker buildx build \
            --file Dockerfile.deploy \
            --tag $IMAGE_URL:${{ needs.prepare.outputs.head_sha }} \
            --tag $IMAGE_URL:${{ needs.prepare.outputs.short_sha }} \
            --tag $IMAGE_URL:latest \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT

  # ==========================================================================
  # Deploy Job - GKE 배포
  # ==========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [prepare, build-image]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GCP_ZONE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install External Secrets Operator
        run: |
          # CRD 존재 여부로 ESO 설치 확인
          if ! kubectl get crd externalsecrets.external-secrets.io &>/dev/null; then
            echo "Installing External Secrets Operator..."
            helm repo add external-secrets https://charts.external-secrets.io
            helm repo update

            # 기존 실패한 설치가 있으면 삭제
            if kubectl get namespace external-secrets &>/dev/null; then
              echo "Cleaning up failed installation..."
              helm uninstall external-secrets -n external-secrets --ignore-not-found || true
            fi

            helm install external-secrets external-secrets/external-secrets \
              -n external-secrets \
              --create-namespace \
              --set installCRDs=true

            # ESO가 준비될 때까지 대기
            kubectl wait --for=condition=available deployment/external-secrets \
              -n external-secrets --timeout=120s

            # CRD 등록 완료 대기
            echo "Waiting for CRDs to be fully registered..."
            kubectl wait --for=condition=established crd/externalsecrets.external-secrets.io --timeout=60s
            kubectl wait --for=condition=established crd/secretstores.external-secrets.io --timeout=60s
            kubectl wait --for=condition=established crd/clustersecretstores.external-secrets.io --timeout=60s
          else
            echo "External Secrets Operator already installed"
          fi

      - name: Deploy to GKE
        run: |
          # Replace placeholders in all k8s manifests
          for file in k8s/*.yaml; do
            sed -i "s|PROJECT_ID|${{ vars.GCP_PROJECT_ID }}|g" "$file"
          done
          sed -i "s|:latest|:${{ needs.prepare.outputs.head_sha }}|g" k8s/deployment.yaml

          # 1. 기본 리소스 먼저 적용 (namespace, serviceaccount)
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/serviceaccount.yaml

          # 2. ESO 리소스 적용 (SecretStore -> ExternalSecret 순서)
          kubectl apply -f k8s/secret-store.yaml
          kubectl apply -f k8s/external-secret.yaml

          # 3. Secret 동기화 대기 (최대 60초)
          echo "Waiting for secret sync..."
          for i in {1..12}; do
            if kubectl get secret ${{ env.SERVICE_NAME }}-secrets -n ${{ vars.K8S_NAMESPACE }} &>/dev/null; then
              echo "Secret synced successfully"
              break
            fi
            echo "Waiting for secret... ($i/12)"
            sleep 5
          done

          # 4. 나머지 리소스 적용
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/backend-config.yaml

          # Wait for rollout
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
            -n ${{ vars.K8S_NAMESPACE }} \
            --timeout=300s

      - name: Verify deployment
        run: |
          echo "Checking deployment status..."
          kubectl get deployment ${{ env.SERVICE_NAME }} -n ${{ vars.K8S_NAMESPACE }}
          kubectl get pods -l app=${{ env.SERVICE_NAME }} -n ${{ vars.K8S_NAMESPACE }}

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: ${{ needs.prepare.outputs.head_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Short SHA**: ${{ needs.prepare.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Run ID**: ${{ needs.prepare.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GKE Cluster**: ${{ vars.GKE_CLUSTER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: ${{ vars.K8S_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ vars.GCP_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
