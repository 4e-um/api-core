# ============================================================================
# Backend Integration Workflow
# ============================================================================
# 역할:
#   - 소스 코드 정적 분석(Spotless, Checkstyle)
#   - 테스트 수행 및 JaCoCo 커버리지 생성
#   - Codecov 업로드
#   - SonarCloud 코드 분석
#
# GitHub Secrets:
#   - CODECOV_TOKEN      : Codecov 업로드 토큰 (v4 필수)
#   - SONAR_HOST_URL     : SonarQube/SonarCloud Host (예: https://sonarcloud.io)
#   - SONAR_TOKEN        : SonarCloud Token
#   - SONAR_ORGANIZATION : SonarCloud Organization Key
#   - SONAR_PROJECT      : SonarCloud Project Key
# ============================================================================

name: Integrate Backend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  JAVA_VERSION: '17'

jobs:
  integrate:
    name: Backend Integration Pipeline
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Run Tests with JaCoCo
        run: ./gradlew test jacocoTestReport

      - name: Upload coverage to Codecov
        if: hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests
          fail_ci_if_error: false

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT: ${{ secrets.SONAR_PROJECT }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew sonar -Dsonar.host.url=$SONAR_HOST_URL

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: build/libs/*.jar

      - name: Integration Summary
        run: |
          echo "## Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch** : ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
