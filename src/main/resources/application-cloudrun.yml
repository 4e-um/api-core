# =============================================================================
# Cloud Run 프로필 설정
# =============================================================================
# Cloud Run에서 Cloud SQL 연결 시 Socket Factory 사용
# Terraform이 제공하는 환경변수:
#   - DB_INSTANCE_CONNECTION_NAME: Cloud SQL 연결 이름
#   - POSTGRES_DATABASE: 데이터베이스 이름
#   - POSTGRES_USER: 데이터베이스 사용자
#   - POSTGRES_PASSWORD: 데이터베이스 비밀번호
#   - URECA_SECRET_KEY: 암호화 시크릿 키 (application-secret.yml에서 사용)
#   - URECA_HASH_KEY: 해시 키 (application-secret.yml에서 사용)
# =============================================================================

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql:///${POSTGRES_DATABASE}?cloudSqlInstance=${DB_INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
    # DB 연결 실패해도 앱 시작 허용 (디버깅용)
    defer-datasource-initialization: true

logging:
  level:
    # Cloud SQL 연결 디버깅
    com.google.cloud.sql: DEBUG
    com.zaxxer.hikari: DEBUG
